# Coolify: app + Postgres in one stack (hostname `db` resolves on the compose
# network). Use Build Pack = Docker Compose and set Compose file to this path.
# Coolify handles HTTPS — no Caddy service needed.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/attendance
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      SHARED_SECRET: ${SHARED_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

volumes:
  pgdata:
