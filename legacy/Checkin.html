<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
         margin: 0; background: #f1f5f9; color: #0f172a; }
  .card { max-width: 460px; margin: 24px auto; background:#fff; border-radius:16px;
          padding:24px; box-shadow:0 6px 24px rgba(15,23,42,.08); }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#64748b; font-size:14px; margin-bottom:20px; }
  label { display:block; font-size:13px; color:#475569; margin:14px 0 6px; }
  input { width:100%; padding:14px; font-size:18px; border:1px solid #cbd5e1;
          border-radius:10px; -webkit-appearance:none; }
  button { width:100%; margin-top:20px; padding:15px; font-size:17px; font-weight:600;
           border:0; border-radius:10px; background:#2563eb; color:#fff; cursor:pointer; }
  button:disabled { background:#94a3b8; }
  .msg { margin-top:18px; padding:14px; border-radius:10px; font-size:15px; display:none; }
  .ok  { background:#dcfce7; color:#166534; }
  .err { background:#fee2e2; color:#991b1b; }
  .pill { display:inline-block; background:#eff6ff; color:#1d4ed8; border-radius:999px;
          padding:4px 12px; font-size:13px; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <h1>Attendance Check-in</h1>
  <div class="sub">
    <span class="pill">Session <?= session ?> · Day <?= day ?>, Class <?= period ?></span><br>
    <span style="display:inline-block;margin-top:8px;"><?= profName ?></span>
  </div>

  <label for="sid">Student ID</label>
  <input id="sid" inputmode="numeric" autocomplete="off" placeholder="e.g. 0190123" autofocus>

  <button id="go" onclick="submit()">Mark me present</button>
  <div id="msg" class="msg"></div>
</div>

<script>
  var SESSION = "<?= session ?>", PROF = "<?= profIndex ?>", TOKEN = "<?= token ?>";

  function deviceId() {
    var k = 'att_device_id';
    var v = localStorage.getItem(k);
    if (!v) { v = 'd-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
              localStorage.setItem(k, v); }
    return v;
  }

  function show(cls, text) {
    var m = document.getElementById('msg');
    m.className = 'msg ' + cls; m.textContent = text; m.style.display = 'block';
  }

  function send(lat, lng) {
    google.script.run
      .withSuccessHandler(function (r) {
        document.getElementById('go').disabled = false;
        if (r.ok) {
          show('ok', '✓ Present — ' + r.name);
          document.getElementById('go').textContent = 'Done';
          document.getElementById('go').disabled = true;
        } else {
          document.getElementById('go').textContent = 'Try again';
          show('err', r.msg);
        }
      })
      .withFailureHandler(function () {
        document.getElementById('go').disabled = false;
        document.getElementById('go').textContent = 'Try again';
        show('err', 'Network hiccup — tap Try again.');
      })
      .recordAttendance({
        session: SESSION, prof: PROF, token: TOKEN,
        id: document.getElementById('sid').value,
        deviceId: deviceId(), lat: lat, lng: lng
      });
  }

  function submit() {
    var id = document.getElementById('sid').value.trim();
    if (!id) { show('err', 'Please enter your Student ID.'); return; }
    var b = document.getElementById('go');
    b.disabled = true; b.textContent = 'Submitting…';
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (pos) { send(pos.coords.latitude, pos.coords.longitude); },
        function ()    { send(null, null); },      // location denied — still submit (unless REQUIRE_GEO)
        { enableHighAccuracy: true, timeout: 6000 }
      );
    } else { send(null, null); }
  }

  document.getElementById('sid').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submit();
  });
</script>
</body>
</html>
