<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
         margin: 0; background: #0f172a; color: #e2e8f0; text-align: center; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; color: #94a3b8; margin: 8px 0 20px; }
  .setup { background:#1e293b; border-radius:14px; padding:20px; display:inline-block; }
  label { display:block; text-align:left; font-size:13px; color:#94a3b8; margin:10px 0 4px; }
  select { width:260px; padding:10px; border-radius:8px; border:1px solid #334155;
           background:#0f172a; color:#e2e8f0; font-size:15px; }
  button { margin-top:18px; padding:12px 28px; font-size:16px; font-weight:600;
           border:0; border-radius:10px; background:#3b82f6; color:#fff; cursor:pointer; }
  button:hover { background:#2563eb; }
  .live { display:none; }
  .session-tag { font-size:26px; font-weight:700; color:#f8fafc; margin:6px 0; }
  .prof-tag { font-size:16px; color:#94a3b8; margin-bottom:18px; }
  .qrbox { background:#fff; padding:24px; border-radius:18px; display:inline-block; }
  .hint { margin-top:16px; color:#64748b; font-size:14px; }
  .count { margin-top:14px; font-size:34px; font-weight:800; color:#22c55e; }
  .count span { font-size:15px; font-weight:500; color:#94a3b8; display:block; }
  .small { font-size:12px; color:#475569; margin-top:8px; }
  .stop { background:#334155; margin-top:22px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Employability Readiness — Attendance</h1>

  <!-- SETUP -->
  <div id="setup" class="setup">
    <label>Professor</label>
    <select id="prof">
      <? for (var i = 0; i < professors.length; i++) { ?>
        <option value="<?= i ?>"><?= professors[i] ?></option>
      <? } ?>
    </select>
    <label>Day</label>
    <select id="day">
      <? for (var d = 1; d <= days; d++) { ?><option value="<?= d ?>">Day <?= d ?></option><? } ?>
    </select>
    <label>Class / Period</label>
    <select id="period">
      <? for (var c = 1; c <= periods; c++) { ?><option value="<?= c ?>">Class <?= c ?></option><? } ?>
    </select>
    <br><button onclick="start()">Show QR for this class</button>
  </div>

  <!-- LIVE -->
  <div id="live" class="live">
    <div class="session-tag" id="sessTag"></div>
    <div class="prof-tag" id="profTag"></div>
    <div class="qrbox"><canvas id="qr"></canvas></div>
    <div class="hint">Scan with your phone camera. The code refreshes automatically — a screenshot will not work for long.</div>
    <div class="count" id="count">0<span>checked in</span></div>
    <div class="small" id="refreshNote">live</div>
    <br><button class="stop" onclick="location.reload()">End / change class</button>
  </div>
</div>

<script>
  var WEBAPP = "<?= webappUrl ?>";
  var PERIODS = <?= periods ?>;
  var session, profIndex, profName, qr, refreshTimer, countTimer;

  function start() {
    var day = parseInt(document.getElementById('day').value, 10);
    var per = parseInt(document.getElementById('period').value, 10);
    profIndex = document.getElementById('prof').value;
    profName  = document.getElementById('prof').selectedOptions[0].text;
    session   = (day - 1) * PERIODS + per;

    document.getElementById('setup').style.display = 'none';
    document.getElementById('live').style.display = 'block';
    document.getElementById('sessTag').textContent = 'Session ' + session + '  ·  Day ' + day + ', Class ' + per;
    document.getElementById('profTag').textContent = profName;

    qr = new QRious({ element: document.getElementById('qr'), size: 320, level: 'M' });
    refresh();
    refreshTimer = setInterval(refresh, 25000);     // pull a fresh token every 25s
    poll();
    countTimer = setInterval(poll, 8000);
  }

  function refresh() {
    google.script.run.withSuccessHandler(function (token) {
      var url = WEBAPP + '?page=checkin&s=' + session + '&p=' + profIndex + '&t=' + token;
      qr.value = url;
      var n = document.getElementById('refreshNote');
      n.textContent = 'refreshed ' + new Date().toLocaleTimeString();
    }).getToken(session, profIndex);
  }

  function poll() {
    google.script.run.withSuccessHandler(function (c) {
      document.getElementById('count').innerHTML = c + '<span>checked in</span>';
    }).getCount(session);
  }
</script>
</body>
</html>
